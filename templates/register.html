{% extends "base.html" %}
{% block title %}Register — PrimaryTrack{% endblock %}

{% block content %}

<div style="min-height:90vh; display:flex; align-items:center; justify-content:center; padding:2rem;">
  <div style="width:100%; max-width:480px;">

    <div style="text-align:center; margin-bottom:1.5rem;">
      <div style="font-size:2.5rem;">📝</div>
      <h1 style="font-family:'Merriweather',serif; color:var(--primary); margin:0.5rem 0 0.25rem;">
        Create Account
      </h1>
      <p class="text-muted">Register as a new teacher to use PrimaryTrack.</p>
    </div>

    <div class="card">
      <form method="POST" action="{{ url_for('auth.register') }}">

        <div class="form-group">
          <label class="form-label" for="full_name">Full Name</label>
          <input type="text" id="full_name" name="full_name" class="form-control"
                 placeholder="e.g. Nakato Sarah" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-control"
                 placeholder="you@school.ac.ug" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control"
                 placeholder="At least 6 characters" required minlength="6"/>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">Confirm Password</label>
          <input type="password" id="confirm_password" name="confirm_password"
                 class="form-control" placeholder="Repeat password" required />
        </div>

        <button type="submit" class="btn btn-primary"
                style="width:100%; justify-content:center; margin-top:0.5rem;">
          Create Account
        </button>
      </form>

      <p class="text-muted mt-2" style="text-align:center;">
        Already have an account?
        <a href="{{ url_for('auth.login') }}" style="color:var(--primary); font-weight:600;">Sign In</a>
      </p>
    </div>

  </div>
</div>
{% endblock %}
